background: '#EFF1FE'
configurate_methods:
- predefined-model
- customizable-model
extra:
  python:
    model_sources:
    - models/llm/llm.py
    - models/rerank/rerank.py
    - models/text_embedding/text_embedding.py
    - models/tts/tts.py
    - models/speech2text/speech2text.py
    provider_source: provider/tongyi.py
help:
  title:
    en_US: Get your API key from AliCloud
    zh_Hans: 从阿里云百炼获取 API Key
  url:
    en_US: https://bailian.console.aliyun.com/?apiKey=1#/api-key
icon_large:
  en_US: icon_l_en.png
  zh_Hans: icon_l_zh.png
icon_small:
  en_US: icon_s_en.png
label:
  en_US: Tongyi
  zh_Hans: 通义
model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: Dashscope API Key
    placeholder:
      en_US: Enter your Dashscope API Key
      zh_Hans: 在此输入您的 Dashscope API Key
    required: true
    type: secret-input
    variable: dashscope_api_key
  - label:
      en_US: DashScope Endpoint URL
      zh_Hans: DashScope Endpoint URL
    placeholder:
      en_US: Enter your AI gateway DashScope endpoint URL
      zh_Hans: 输入您的 AI 网关 DashScope endpoint URL
    required: true
    type: text-input
    variable: dashscope_endpoint_url
  - label:
      en_US: Compatible API Key
      zh_Hans: Compatible API Key
    placeholder:
      en_US: Optional. Defaults to API Key when empty
      zh_Hans: 可选。留空时默认使用 API Key
    required: false
    type: secret-input
    variable: compatible_api_key
  - label:
      en_US: Compatible Endpoint URL
      zh_Hans: Compatible Endpoint URL
    placeholder:
      en_US: Optional. Defaults to DashScope Endpoint URL when empty
      zh_Hans: 可选。留空时默认使用 DashScope Endpoint URL
    required: false
    type: text-input
    variable: compatible_endpoint_url
  - default: '4096'
    label:
      en_US: Model context size
      zh_Hans: 模型上下文长度
    placeholder:
      en_US: Enter your Model context size
      zh_Hans: 在此输入您的模型上下文长度
    required: true
    type: text-input
    variable: context_size
  - default: '4096'
    label:
      en_US: Upper bound for max tokens
      zh_Hans: 最大 token 上限
    show_on:
    - value: llm
      variable: __model_type
    type: text-input
    variable: max_tokens
  - default: no_call
    label:
      en_US: Function calling
    options:
    - label:
        en_US: Not Support
        zh_Hans: 不支持
      value: no_call
    - label:
        en_US: Support
        zh_Hans: 支持
      value: function_call
    required: false
    show_on:
    - value: llm
      variable: __model_type
    type: select
    variable: function_calling_type
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
      - models/rerank/*.yaml
  speech2text:
    predefined:
      - models/speech2text/*.yaml
  text_embedding:
    predefined:
      - models/text_embedding/*.yaml
  tts:
    predefined:
      - models/tts/*.yaml
provider: tongyi
provider_credential_schema:
  credential_form_schemas:
  - label:
      en_US: Dashscope API Key
    placeholder:
      en_US: Enter your Dashscope API Key
      zh_Hans: 在此输入您的 Dashscope API Key
    required: true
    type: secret-input
    variable: dashscope_api_key
  - label:
      en_US: DashScope Endpoint URL
      zh_Hans: DashScope Endpoint URL
    placeholder:
      en_US: Enter your AI gateway DashScope endpoint URL
      zh_Hans: 输入您的 AI 网关 DashScope endpoint URL
    required: true
    type: text-input
    variable: dashscope_endpoint_url
  - label:
      en_US: Compatible API Key
      zh_Hans: Compatible API Key
    placeholder:
      en_US: Optional. Defaults to API Key when empty
      zh_Hans: 可选，留空时默认使用 API Key
    required: false
    type: secret-input
    variable: compatible_api_key
  - label:
      en_US: Compatible Endpoint URL
      zh_Hans: Compatible Endpoint URL
    placeholder:
      en_US: Optional. Defaults to DashScope Endpoint URL when empty
      zh_Hans: 可选，留空时默认使用 DashScope Endpoint URL
    required: false
    type: text-input
    variable: compatible_endpoint_url
  - label:
      en_US: Use International Endpoint for Speech-to-Text
      zh_Hans: Speech-to-Text 使用国际端点
    type: radio
    required: false
    default: "false"
    variable: use_international_endpoint
    options:
      - label:
          en_US: "True"
          zh_Hans: "是"
        value: "true"
      - label:
          en_US: "False"
          zh_Hans: "否"
        value: "false"
supported_model_types:
  - llm
  - text-embedding
  - rerank
  - speech2text
  - tts
