# for more details, please refer to https://help.aliyun.com/zh/model-studio/kimi-api
model: kimi-k2.6
label:
  zh_Hans: kimi-k2.6
  en_US: kimi-k2.6
model_type: llm
features:
  - vision
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 32768
    min: 1
    max: 32768
  - name: enable_thinking
    label:
      zh_Hans: Thinking Mode
      en_US: Thinking Mode
    type: boolean
    default: true
    required: false
  - name: thinking_budget
    required: false
    type: int
    default: 2048
    min: 1
    max: 32768
    label:
      zh_Hans: Thinking budget
      en_US: Thinking budget
  - name: response_format
    label:
      zh_Hans: Response Format
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
  - name: extra_headers
    required: false
    type: string
    label:
      zh_Hans: Extra Headers
      en_US: Extra Headers
pricing:
  input: '4'
  output: '14'
  unit: '0.000001'
  currency: RMB
